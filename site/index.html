<div id="app" class="app">
  <section id="opening" class="opening" aria-labelledby="op-title">
    <canvas class="static" width="160" height="90" aria-hidden="true"></canvas>
    <div class="op-inner">
      <h1 class="op-file" id="op-title">CASE FILE 001</h1>
      <p class="op-status">STATUS: <span data-status>UNRESOLVED</span></p>
      <blockquote class="op-quote"><p>“Something was left here. Nobody remembers putting it here.”</p></blockquote>
      <button class="btn btn-begin" id="begin" type="button">BEGIN INVESTIGATION</button>
      <div class="op-restart">
        <button class="link-quiet" id="restart" type="button" hidden>Start over</button>
        <div class="restart-confirm" id="restart-confirm" hidden>
          <p>Erase all progress on this device and start again?</p>
          <button class="btn btn-danger" id="restart-yes" type="button">Erase progress</button>
          <button class="btn-ghost" id="restart-no" type="button">Cancel</button>
        </div>
      </div>
    </div>
    <noscript><p class="noscript">This case file needs JavaScript to open.</p></noscript>
  </section>
  <div id="screen" class="screen" hidden></div>
</div>
<div id="layer"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
